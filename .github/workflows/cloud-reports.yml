name: Cloud security reports

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'
    - cron: '0 6 1 * *'
    # Catch up after cold starts, missed triggers or a temporary provider failure.
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: extsecure-cloud-reports
  cancel-in-progress: false

jobs:
  reports:
    # Public standard runners are free; never switch to paid/larger runners.
    if: github.repository == 'hassanaliff-ai/browser-extension-' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: src
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: ${{ runner.temp }}/extsecure-models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check report periods with short-lived workflow identity
        id: queue
        run: python3 scripts/run_cloud_reports.py --probe
      - name: Install minimal report dependencies
        if: steps.queue.outputs.pending == 'true'
        run: python3 -m pip install --disable-pip-version-check -r requirements-report-worker.txt
      - name: Install verified CPU inference runtime
        if: steps.queue.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/extsecure-ollama"
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst' \
            -o "$RUNNER_TEMP/extsecure-ollama.tar.zst"
          echo "b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf  $RUNNER_TEMP/extsecure-ollama.tar.zst" | sha256sum --check
          tar --zstd --extract --file "$RUNNER_TEMP/extsecure-ollama.tar.zst" \
            --directory "$RUNNER_TEMP/extsecure-ollama" \
            --exclude='*cuda*' --exclude='*vulkan*' --exclude='*rocm*'
          rm -f "$RUNNER_TEMP/extsecure-ollama.tar.zst"
          echo "$RUNNER_TEMP/extsecure-ollama/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/extsecure-ollama/bin/ollama" serve > "$RUNNER_TEMP/extsecure-ollama.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:11434/api/version' > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Download the pinned open report model
        if: steps.queue.outputs.pending == 'true'
        run: ollama pull qwen2.5:7b-instruct-q4_K_M > "$RUNNER_TEMP/extsecure-model-download.log" 2>&1
      - name: Generate and validate reports, save to Neon through the API
        if: steps.queue.outputs.pending == 'true'
        run: python3 scripts/run_cloud_reports.py
      - name: Record inference setup failures for recovery
        if: failure() && steps.queue.outputs.pending == 'true'
        run: python3 scripts/run_cloud_reports.py --mark-failed
      - name: Remove ephemeral job tickets
        if: always()
        run: rm -f "$RUNNER_TEMP/extsecure-report-jobs.json"
