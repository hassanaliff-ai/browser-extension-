name: Private scheduled reports

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'
    - cron: '0 6 1 * *'
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: extsecure-private-reports
  cancel-in-progress: false

jobs:
  reports:
    if: github.repository == 'hassanaliff-ai/browser-extension-' && github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.EXTSECURE_PRIVATE_REPORTS_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trigger report preparation inside Render and Neon
        run: python3 scripts/run_cloud_reports.py
