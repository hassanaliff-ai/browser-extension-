name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # No VT_API_KEY is set on purpose: the suite is fully mocked and
      # tests/conftest.py forces a dummy key.
      - name: Run tests
        run: |
          set +e
          python -m pytest --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            grep -E '^(ERROR |FAILED |E +[A-Za-z]+Error:|Interrupted:)' pytest.log | head -12 |
              while IFS= read -r line; do
                printf '::error::%s\n' "${line//%/%25}"
              done
          fi
          exit "$status"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Chrome extension logic
        run: node --test extension/tests/*.test.js
